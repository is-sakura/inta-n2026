<div class="quiz-bg" [style.background-image]="'url(' + backgroundUrl + ')'"></div>

<div class="quiz-container">


<span *ngIf="badgeTitle$ | async as title" class="trainer-badge"> {{ title }}</span>


  <div *ngIf="isLoading" class="text-center">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
  </div>

  <!--画像-->
  <div class="quiz-question">    
      <h2>{{ question }}</h2>
      <img [src]="imageUrl" [style.width.px]="150 * imageScale" alt="なぞのポケモン">
  </div>

  <!--ヒント-->
  <div class="quiz-info" [formGroup]="form">
      <div class="info-row">
        <label>タイプ：</label>
        <input formControlName="types" readonly>
      </div>
      <div class="info-row">
        <label>しんか：</label>
        <input formControlName="evolutions" readonly>
      </div>
      <div class="info-row">
        <label>とくせい：</label>
        <input formControlName="abilities" readonly>
      </div>
      <div class="info-row">
        <label>かくれとくせい：</label>
        <input formControlName="hiddenAbilities" readonly>
      </div>
  </div>

  <!--答え-->
  <div class="quiz-answer">
    
     <button type="button" [class]="'btn ' + color1 + ' mb-1 answer'" (click)="register(answer1)">
        {{ answer1 }}
    </button>
     <button type="button" [class]="'btn ' + color2 + ' mb-1 answer'" (click)="register(answer2)">
        {{ answer2 }}
    </button>
     <button type="button" [class]="'btn ' + color3 + ' mb-1 answer'" (click)="register(answer3)">
        {{ answer3 }}
    </button>
     <button type="button" [class]="'btn ' + color4 + ' mb-1 answer'" (click)="register(answer4)">
        {{ answer4 }}
    </button>

  </div>
</div>
